x-logging: &logging
  options:
    max-size: 5m
    max-file: 3

services:
  ddns:
    image: rstrice/ddns64:latest
    build:
      context: .
      dockerfile: Containerfile
    container_name: ddns64
    restart: unless-stopped
    hostname: ddns64
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/:/app/config/:ro
    logging: *logging
    healthcheck:
      test: ["CMD", "health"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 1m
